<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Utah Rafters</title>
    <meta name="description" content="How to contact Utah Rafters">
    <meta name="author" content="Tyson Sampson">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Raleway:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/crossedoars.jpeg" alt="Rafting Company Logo" class="Logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main class="grid contact">
        <form action="#" class="contactform">
            <fieldset>
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required placeholder="John Doe">
                
                <label for="email">Email:</label>
                <input type="email" name="email" id="emailaddress" required>
            </fieldset>

            <fieldset class="radio-inputs">
                <input type="radio" id="general" name="drone" value="general" checked />
                <label for="general">General Questions</label>

                <input type="radio" id="reservation" name="drone"
                value="reservation">
                <label for="reservation">Reservation Question</label>

                <input type="radio" id="website" name="web" value="website">
                <label for="website">Website Suggestion</label>
            </fieldset>
            <fieldset>
                <label for="message">Message:</label>
                <textarea name="message" id="message" cols="30" rows="10"></textarea>
            </fieldset>
            <div class="signup">
                <input type="checkbox" name="newsletter" id="newsletter">
                <label for="newsletter">Please subscribe me to the monthly newsletter</label>
            </div>
            <button type="submit" class="submit-button">Send Message</button>
        </form>

        <section class="address">
            <h2>Our Contact Info</h2>
            <address>123 creekside way, <br>Provo, UT 84647</address>
            <a href="tel: +888-888-8881"> (888) 888-8881</a>
            <a href="mailto:support@utahrafters.com">support@utahrafters.com</a>
            <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d12857.674459092023!2d-111.64228219630377!3d40.32342167782869!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x874d8fe63621cb8f%3A0xf91176adef2440c!2sMount%20Timpanogos%20Park!5e0!3m2!1sen!2sus!4v1755230995620!5m2!1sen!2sus" 
            width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade" class="gmap"></iframe>
        </section>    
        <hr class="hrule">
        <section class="grid employees">
            <h2>Our Employees</h2>
            <figure class="employee">
                <img src="images/mike.webp" alt="Mike C">
                <figcaption>Mike, Ceo</figcaption>
            </figure>
            <figure class="employee">
                <img src="images/jill.webp" alt="Jill A">
                <figcaption>Jill, Instructor</figcaption>
            </figure>
            <figure class="employee">
                <img src="images/ryan.webp" alt="Ryan M">
                <figcaption>Ryan, Instructor</figcaption>
            </figure>

        </section>
        
    </main>

    <footer>
        <p>&copy;<span id="demo"></span>©2025 Utah Rafters, Tyson Sampson</p>
        <nav class="sociallinks">
            <a href="https://facebook.com">
                <img src="images/facebook-icon.png" alt="facebook">
            </a>
            <a href="https://twitter.com">
                <img src="images/twitter-icon.png" alt="twitter">
            </a>
            <a href="https://instagram.com">
                <img src="images/insta-icon.png" alt="instagram">
                 <a href="https://drive.google.com/file/d/1Y0jAX3MGiASYtBrNk9wWGUcUPDucBFZJ/view?usp=sharing>wireframe/a>
        
        </nav>
    </footer>
</body>

</html>
